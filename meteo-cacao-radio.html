<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Météo en France — Cacao Radio</title>
<style>
:root{--brown:#563428;--muted:#80675b}*{box-sizing:border-box}
body{margin:0;background:transparent;color:var(--brown);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
.widget{max-width:940px;margin:auto;background:linear-gradient(160deg,#fffdf9,#f7eadb);border:1px solid #e8d8c8;border-radius:18px;padding:18px;box-shadow:0 10px 32px #5634280d}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}h1{font-size:24px;margin:0;font-weight:750}.sub{color:var(--muted);font-size:12px}
.days{display:flex;gap:7px;overflow-x:auto;padding:15px 0 8px}.days button{flex:1;min-width:94px;border:1px solid #d9c2b2;border-radius:11px;background:white;color:var(--brown);padding:10px 6px;cursor:pointer;font-weight:650}.days button[aria-pressed=true]{background:var(--brown);color:white}
.map{position:relative;max-width:660px;margin:auto;width:100%;aspect-ratio:590/540;background:radial-gradient(ellipse at 55% 40%,#edf5f4 0%,#e5f0ef 68%,#f7f3ec 100%);border-radius:16px;overflow:hidden}.map svg{width:100%;height:100%;display:block}
.pin{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;flex-direction:column;line-height:1.05;white-space:nowrap;text-align:center;z-index:2;filter:drop-shadow(0 1px 2px #ffffffcc)}.pin.right-edge{transform:translate(-100%,-50%)}.pin.left-edge{transform:translate(0,-50%)}
.pin .city{font-size:10px;font-weight:750;color:#50362b;background:#ffffffd9;border-radius:4px;padding:1px 3px}.pin .weather{font-size:20px;line-height:1.15;filter:drop-shadow(0 1px 1px #fff)}.pin .temp{background:#fffdface;border:1px solid #ddc6b4;border-radius:8px;padding:2px 5px;box-shadow:0 1px 4px #56342818;font-size:12px;font-weight:800}
.status{font-size:12px;color:var(--muted);padding-top:10px}.credit{font-size:11px;color:var(--muted);margin-top:12px}.credit a{color:inherit}
@media(max-width:650px){.widget{padding:12px;border-radius:12px}h1{font-size:21px}.map{max-width:440px}.pin .city{font-size:9px}.pin .temp{font-size:9px;padding:1px 3px}.pin .weather{font-size:14px}}
</style>
</head>
<body>
<main class="widget">
<div class="top"><h1>☀️ La météo en France</h1><div class="sub">CACAO RADIO · Prévisions sur 5 jours · 14 villes</div></div>
<nav class="days" id="days" aria-label="Choisir le jour"></nav>
<section class="map" aria-label="Carte météo de la France métropolitaine et de la Corse">
<svg viewBox="-35 -10 590 540" role="img" aria-label="Contours de la France métropolitaine et de la Corse">
<path d="M 418.5 109.3 L 435.1 123.4 L 485.9 133.3 L 468.1 170.0 L 463.6 208.3 L 454.0 217.4 L 437.9 212.5 L 439.0 226.1 L 413.3 256.3 L 412.8 280.6 L 429.6 272.2 L 441.7 295.7 L 440.2 310.9 L 450.6 331.1 L 438.4 347.4 L 447.4 389.0 L 466.5 395.8 L 462.5 419.1 L 430.6 449.4 L 361.2 434.9 L 309.9 452.3 L 305.8 484.6 L 265.0 491.6 L 225.4 467.3 L 212.6 478.9 L 147.8 454.5 L 133.8 433.6 L 152.0 401.4 L 158.7 294.5 L 122.3 238.1 L 96.4 211.0 L 42.6 190.3 L 39.0 151.2 L 84.7 139.5 L 143.8 153.3 L 132.6 92.5 L 165.9 115.6 L 247.8 73.7 L 258.4 29.7 L 289.2 18.9 L 294.3 37.7 L 310.7 38.6 L 327.0 60.2 L 351.6 85.5 L 369.7 81.3 L 400.5 105.8 L 408.4 110.4 L 418.5 109.3 Z" fill="#efe1ca" stroke="#9d7863" stroke-width="2.3" stroke-linejoin="round"/>
<path d="M 471 443 C 465 449 467 461 463 470 C 459 480 461 492 466 501 C 472 497 477 487 480 478 C 484 468 479 454 475 445 Z" fill="#efe1ca" stroke="#9d7863" stroke-width="2" stroke-linejoin="round"/>
</svg><div id="pins"></div>
</section>
<div class="status" id="status" role="status">Chargement des prévisions…</div>
<div class="credit">Données météo : <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>. Températures maximales journalières. Prévisions indicatives.</div>
</main>
<script>
// Positions reprises de la carte précédente, avec marges supplémentaires et Brest.
// x/y sont les coordonnées de l'ancien dessin SVG (500 × 510).
const cities=[
{name:'Lille',lat:50.6292,lon:3.0573,x:308.25,y:46.61},
{name:'Le Havre',lat:49.4944,lon:0.1079,x:204.45,y:107.56},
{name:'Paris',lat:48.8566,lon:2.3522,x:283.45,y:141.83},
{name:'Strasbourg',lat:48.5734,lon:7.7521,x:473.5,y:157.03,edge:'right-edge'},
{name:'Brest',lat:48.3904,lon:-4.4861,x:55,y:170,edge:'left-edge'},
{name:'Rennes',lat:48.1173,lon:-1.6778,x:141.6,y:181.51},
{name:'Nantes',lat:47.2184,lon:-1.5536,x:145.95,y:229.81},
{name:'Tours',lat:47.3941,lon:0.6848,x:224.75,y:220.37},
{name:'Dijon',lat:47.322,lon:5.0415,x:378.1,y:224.25},
{name:'Lyon',lat:45.764,lon:4.8357,x:370.85,y:307.94},
{name:'Bordeaux',lat:44.8378,lon:-0.5792,x:180.25,y:357.66},
{name:'Toulouse',lat:43.6047,lon:1.4442,x:251.5,y:423.86},
{name:'Marseille',lat:43.2965,lon:5.3698,x:389.65,y:440.44},
{name:'Ajaccio',lat:41.9192,lon:8.7386,x:474,y:471}
];
const symbols=code=>code===0?'☀️':code<=2?'🌤️':code===3?'☁️':code===45||code===48?'🌫️':code>=51&&code<=67?'🌧️':code>=71&&code<=77?'🌨️':code>=80&&code<=82?'🌦️':code>=95?'⛈️':'🌤️';
const describe=code=>code===0?'Ensoleillé':code<=2?'Éclaircies':code===3?'Couvert':code===45||code===48?'Brouillard':code>=51&&code<=67?'Pluie':code>=71&&code<=77?'Neige':code>=80&&code<=82?'Averses':code>=95?'Orages':'Variable';
let forecasts=[],chosen=0;
function render(){
const dates=forecasts[0].daily.time;
document.getElementById('days').innerHTML=dates.map((d,i)=>`<button type="button" aria-pressed="${i===chosen}" data-day="${i}">${i===0?"Aujourd'hui":i===1?'Demain':new Intl.DateTimeFormat('fr-FR',{weekday:'short',day:'numeric'}).format(new Date(d+'T12:00:00'))}</button>`).join('');
document.getElementById('pins').innerHTML=cities.map((c,i)=>{const d=forecasts[i].daily;const x=(c.x+35)/590*100,y=(c.y+10)/540*100;return `<div class="pin ${c.edge||''}" style="left:${x}%;top:${y}%" title="${c.name} : ${describe(d.weather_code[chosen])}"><span class="city">${c.name}</span><span class="weather">${symbols(d.weather_code[chosen])}</span><span class="temp">${Math.round(d.temperature_2m_max[chosen])}°</span></div>`}).join('');
document.getElementById('status').textContent='Prévisions sur 5 jours · Mise à jour à chaque ouverture · Températures maximales';
document.getElementById('days').querySelectorAll('button').forEach(b=>b.onclick=()=>{chosen=Number(b.dataset.day);render()});
}
(async()=>{try{const url='https://api.open-meteo.com/v1/forecast?'+new URLSearchParams({latitude:cities.map(c=>c.lat).join(','),longitude:cities.map(c=>c.lon).join(','),daily:'weather_code,temperature_2m_max,temperature_2m_min',timezone:'Europe/Paris',forecast_days:'5'});const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();forecasts=Array.isArray(data)?data:[data];if(forecasts.length!==cities.length)throw new Error('Réponse incomplète');render()}catch(e){document.getElementById('status').textContent='Prévisions momentanément indisponibles. Réessayez dans quelques instants.';console.error(e)}})();
</script>
<script>
(function () {
  function envoyerHauteur() {
    const hauteur = Math.ceil(Math.max(
      document.body.scrollHeight,
      document.documentElement.scrollHeight
    ));
    window.parent.postMessage({type: 'cacao-meteo-height', height: hauteur}, '*');
  }
  window.addEventListener('load', envoyerHauteur);
  if ('ResizeObserver' in window) new ResizeObserver(envoyerHauteur).observe(document.body);
  envoyerHauteur();
})();
</script>
</body></html>
