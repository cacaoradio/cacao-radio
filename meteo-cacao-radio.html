<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Météo France — Cacao Radio</title>
<style>
:root{--brown:#563428;--cream:#fffaf3;--muted:#80675b}*{box-sizing:border-box}body{margin:0;background:transparent;color:var(--brown);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}.widget{max-width:940px;margin:auto;background:var(--cream);border:1px solid #e8d8c8;border-radius:18px;padding:18px}.top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}h1{font-size:24px;margin:0;font-weight:750}.sub{color:var(--muted);font-size:12px}.days{display:flex;gap:7px;overflow-x:auto;padding:15px 0 8px}.days button{flex:1;min-width:94px;border:1px solid #d9c2b2;border-radius:11px;background:white;color:var(--brown);padding:10px 6px;cursor:pointer;font-weight:650}.days button[aria-pressed=true]{background:var(--brown);color:white}.body{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}.map{position:relative;max-width:600px;margin:auto;width:100%;aspect-ratio:500/510}.map svg{width:100%;height:100%;display:block}.pin{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;flex-direction:column;line-height:1.1;white-space:nowrap;text-align:center;text-shadow:0 1px 2px white,1px 0 2px white,-1px 0 2px white}.pin .city{font-size:11px;font-weight:750}.pin .weather{font-size:19px;line-height:1.15}.pin .temp{font-size:11px;font-weight:750}.details{display:none;padding:7px 0}.details h2{font-size:17px;margin:0 0 8px}.list{display:grid;grid-template-columns:1fr 1fr;gap:7px}.item{background:white;border:1px solid #e8d8c8;border-radius:10px;padding:8px;font-size:12px}.item strong{display:block;font-size:13px}.item span{font-size:17px}.status{font-size:12px;color:var(--muted);padding-top:10px}.credit{font-size:11px;color:var(--muted);margin-top:12px}.credit a{color:inherit}@media(max-width:650px){.widget{padding:12px;border-radius:12px}h1{font-size:21px}.body{grid-template-columns:1fr}.map{max-width:440px}.details{padding:0}.list{grid-template-columns:repeat(3,1fr)}.pin .city,.pin .temp{font-size:9px}.pin .weather{font-size:17px}}@media(max-width:390px){.list{grid-template-columns:1fr 1fr}}
</style></head><body><main class="widget"><div class="top"><h1>☀️ La météo en France</h1><div class="sub">CACAO RADIO · Prévisions sur 5 jours</div></div><nav class="days" id="days" aria-label="Choisir le jour"></nav><div class="body"><section class="map" aria-label="Carte météo de France"><svg viewBox="0 0 500 510" role="img" aria-label="Contours géographiques de la France métropolitaine"><path d="M 418.5 109.3 L 435.1 123.4 L 485.9 133.3 L 468.1 170.0 L 463.6 208.3 L 454.0 217.4 L 437.9 212.5 L 439.0 226.1 L 413.3 256.3 L 412.8 280.6 L 429.6 272.2 L 441.7 295.7 L 440.2 310.9 L 450.6 331.1 L 438.4 347.4 L 447.4 389.0 L 466.5 395.8 L 462.5 419.1 L 430.6 449.4 L 361.2 434.9 L 309.9 452.3 L 305.8 484.6 L 265.0 491.6 L 225.4 467.3 L 212.6 478.9 L 147.8 454.5 L 133.8 433.6 L 152.0 401.4 L 158.7 294.5 L 122.3 238.1 L 96.4 211.0 L 42.6 190.3 L 39.0 151.2 L 84.7 139.5 L 143.8 153.3 L 132.6 92.5 L 165.9 115.6 L 247.8 73.7 L 258.4 29.7 L 289.2 18.9 L 294.3 37.7 L 310.7 38.6 L 327.0 60.2 L 351.6 85.5 L 369.7 81.3 L 400.5 105.8 L 408.4 110.4 L 418.5 109.3 Z" fill="#f0e2d2" stroke="#9d7863" stroke-width="3" stroke-linejoin="round"/></svg><div id="pins"></div></section><div class="status" id="status" role="status">Chargement des prévisions…</div></div><div class="credit">Données météo : <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>. Carte géographique, températures maximales journalières. Prévisions indicatives.</div></main>
<script>
const cities=[
{name:'Lille',lat:50.6292,lon:3.0573,x:61.67,y:9.17},
{name:'Brest',lat:48.3904,lon:-4.4861,x:8.55,y:32.73},
{name:'Paris',lat:48.8566,lon:2.3522,x:56.71,y:27.83},
{name:'Strasbourg',lat:48.5734,lon:7.7521,x:94.73,y:30.81},
{name:'Rennes',lat:48.1173,lon:-1.6778,x:28.33,y:35.61},
{name:'Nantes',lat:47.2184,lon:-1.5536,x:29.20,y:45.07},
{name:'Lyon',lat:45.764,lon:4.8357,x:74.20,y:60.38},
{name:'Bordeaux',lat:44.8378,lon:-0.5792,x:36.06,y:70.13},
{name:'Toulouse',lat:43.6047,lon:1.4442,x:50.31,y:83.11},
{name:'Montpellier',lat:43.6108,lon:3.8767,x:67.44,y:83.04},
{name:'Marseille',lat:43.2965,lon:5.3698,x:77.96,y:86.35},
{name:'Nice',lat:43.7102,lon:7.262,x:91.28,y:82.00}
];
const symbols=code=>code===0?'☀️':code<=2?'🌤️':code===3?'☁️':code===45||code===48?'🌫️':code>=51&&code<=67?'🌧️':code>=71&&code<=77?'🌨️':code>=80&&code<=82?'🌦️':code>=95?'⛈️':'🌤️';
const describe=code=>code===0?'Ensoleillé':code<=2?'Éclaircies':code===3?'Couvert':code===45||code===48?'Brouillard':code>=51&&code<=67?'Pluie':code>=71&&code<=77?'Neige':code>=80&&code<=82?'Averses':code>=95?'Orages':'Variable';
let forecasts=[],chosen=0;
function render(){const f=forecasts[0].daily, dates=f.time;document.getElementById('days').innerHTML=dates.map((d,i)=>`<button type="button" aria-pressed="${i===chosen}" data-day="${i}">${i===0?"Aujourd'hui":i===1?'Demain':new Intl.DateTimeFormat('fr-FR',{weekday:'short',day:'numeric'}).format(new Date(d+'T12:00:00'))}</button>`).join('');document.getElementById('pins').innerHTML=cities.map((c,i)=>{const d=forecasts[i].daily;return `<div class="pin" style="left:${c.x}%;top:${c.y}%" title="${c.name} : ${describe(d.weather_code[chosen])}"><span class="city">${c.name}</span><span class="weather">${symbols(d.weather_code[chosen])}</span><span class="temp">${Math.round(d.temperature_2m_max[chosen])}°</span></div>`}).join('');document.getElementById('status').textContent='Prévisions actualisées automatiquement à chaque ouverture.';document.getElementById('days').querySelectorAll('button').forEach(b=>b.onclick=()=>{chosen=Number(b.dataset.day);render()})}
(async()=>{try{const url='https://api.open-meteo.com/v1/forecast?'+new URLSearchParams({latitude:cities.map(c=>c.lat).join(','),longitude:cities.map(c=>c.lon).join(','),daily:'weather_code,temperature_2m_max,temperature_2m_min',timezone:'Europe/Paris',forecast_days:'5'});const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();forecasts=Array.isArray(data)?data:[data];if(forecasts.length!==cities.length)throw new Error('Réponse incomplète');render()}catch(e){document.getElementById('status').textContent='Prévisions momentanément indisponibles. Réessayez dans quelques instants.';console.error(e)}})();
</script></body></html>
