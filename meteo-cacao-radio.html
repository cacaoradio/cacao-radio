
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contrôle des positions - Cacao Radio</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: transparent;
  font-family: Arial, Helvetica, sans-serif;
}

.weather {
  position: relative;
  width: 100%;
  max-width: 940px;
  margin: 0 auto;
  overflow: hidden;
  container-type: inline-size;
}

.background {
  display: block;
  width: 100%;
  height: auto;
}

.overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

/* Boutons des jours inchangés */
.days {
  position: absolute;
  left: 14.8%;
  top: 18.9%;
  width: 75%;
  height: 5.1%;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: .8%;
  pointer-events: auto;
}

.days button {
  min-width: 0;
  margin: 0;
  padding: 0 1px;
  border: 0;
  background: transparent;
  color: #563428;
  font-family: inherit;
  font-size: clamp(7px, 1.65cqw, 14px);
  font-weight: 800;
  white-space: nowrap;
  cursor: pointer;
}

.days button:first-child {
  color: white;
}

.days button[aria-pressed="true"]:not(:first-child) {
  background: #563428;
  color: white;
  border-radius: 7px;
}

.days button:focus-visible {
  outline: 2px solid #563428;
  outline-offset: -2px;
}

/* Repères de contrôle */
.marker {
  position: absolute;
  transform: translate(-50%, -50%);
  display: flex;
  align-items: center;
  gap: 3px;
  z-index: 2;
}

.marker .dot {
  display: grid;
  place-items: center;
  width: clamp(15px, 2.7cqw, 24px);
  height: clamp(15px, 2.7cqw, 24px);
  flex: 0 0 auto;
  background: #b71c1c;
  color: white;
  border: 2px solid white;
  border-radius: 50%;
  font-size: clamp(8px, 1.35cqw, 12px);
  font-weight: 800;
  box-shadow: 0 1px 4px #0008;
}

.marker .name {
  background: rgba(255, 255, 255, .95);
  color: #42291f;
  padding: 2px 4px;
  border-radius: 4px;
  font-size: clamp(8px, 1.45cqw, 13px);
  font-weight: 800;
  white-space: nowrap;
  box-shadow: 0 1px 4px #0005;
}

@media (max-width: 500px) {
  .days button {
    font-size: clamp(7px, 2.1cqw, 10px);
  }

  .marker {
    gap: 1px;
  }

  .marker .dot {
    width: 15px;
    height: 15px;
    border-width: 1px;
    font-size: 8px;
  }

  .marker .name {
    font-size: 8px;
    padding: 1px 2px;
  }
}
</style>
</head>

<body>

<main class="weather" id="weather">

<img
  class="background"
  src="https://cacaoradio.github.io/cacao-radio/fond-meteo-cacao-radio.png?v=20261023-3"
  alt="La météo en France - Cacao Radio"
  width="1279"
  height="1169"
>

<div class="overlay">
  <nav class="days" id="days" aria-label="Choisir le jour"></nav>
  <div id="markers"></div>
</div>

</main>

<script>
'use strict';

/*
  Positions PROVISOIRES.
  Les repères permettent de vérifier chaque ville.
*/

const cities = [
  {name:'Lille',       x:62.5, y:35.5},
  {name:'Le Havre',    x:50.0, y:43.0},
  {name:'Paris',       x:61.5, y:46.5},
  {name:'Strasbourg',  x:80.5, y:48.0},
  {name:'Brest',       x:34.0, y:43.5},
  {name:'Rennes',      x:44.5, y:49.5},
  {name:'Nantes',      x:45.5, y:56.5},
  {name:'Tours',       x:54.5, y:54.5},
  {name:'Dijon',       x:69.5, y:55.5},
  {name:'Lyon',        x:69.5, y:64.5},
  {name:'Bordeaux',    x:49.5, y:66.5},
  {name:'Toulouse',    x:57.5, y:73.0},
  {name:'Marseille',   x:74.5, y:73.0},
  {name:'Ajaccio',     x:87.0, y:79.0}
];

const markers = document.getElementById('markers');
const days = document.getElementById('days');

markers.innerHTML = cities.map((city, index) => `
  <div
    class="marker"
    style="left:${city.x}%;top:${city.y}%"
    title="${city.name}">
    <span class="dot">${index + 1}</span>
    <span class="name">${city.name}</span>
  </div>
`).join('');

/* Les cinq dates restent visibles */
const today = new Date(
  new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Europe/Paris',
    year: 'numeric',
    month: '2-digit',
    day: '2-digit'
  }).format(new Date()) + 'T12:00:00'
);

const labels = Array.from({length: 5}, (_, index) => {
  if (index === 0) return "Aujourd'hui";
  if (index === 1) return 'Demain';

  const date = new Date(today);
  date.setDate(date.getDate() + index);

  return new Intl.DateTimeFormat('fr-FR', {
    weekday: 'short',
    day: 'numeric'
  }).format(date);
});

let selectedDay = 0;

function renderDays() {
  days.innerHTML = labels.map((label, index) => `
    <button
      type="button"
      data-day="${index}"
      aria-pressed="${index === selectedDay}">
      ${label}
    </button>
  `).join('');

  days.querySelectorAll('button').forEach(button => {
    button.addEventListener('click', () => {
      selectedDay = Number(button.dataset.day);
      renderDays();
    });
  });
}

renderDays();

function reportHeight() {
  if (window.parent === window) return;

  window.parent.postMessage({
    type: 'cacao-meteo-height',
    height: Math.ceil(
      document.getElementById('weather')
        .getBoundingClientRect().height
    )
  }, '*');
}

window.addEventListener('load', reportHeight);
window.addEventListener('resize', reportHeight);
</script>

</body>
</html>
