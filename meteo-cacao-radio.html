
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Météo en France — Cacao Radio</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent;font-family:Arial,Helvetica,sans-serif}
.weather{position:relative;width:100%;max-width:940px;margin:auto;overflow:hidden}
.background{display:block;width:100%;height:auto}
.overlay{position:absolute;inset:0;pointer-events:none}

/* Boutons : alignés sur la rangée imprimée */
.days{
  position:absolute;
  left:15%;
  top:37.5%;
  width:74%;
  height:5.1%;
  display:flex;
  gap:1%;
  pointer-events:auto;
}
.days button{
  flex:1;
  min-width:0;
  border:1px solid #c9ae9c;
  border-radius:5px;
  background:#fffaf3;
  color:#563428;
  padding:0 1px;
  font-size:clamp(7px,1.25vw,12px);
  font-weight:700;
  white-space:nowrap;
  cursor:pointer;
}
.days button[aria-pressed=true]{
  background:#563428;
  color:white;
}

/* Villes et températures */
.pin{
  position:absolute;
  transform:translate(-50%,-50%);
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  line-height:1;
  white-space:nowrap;
  z-index:2;
}
.pin .name{
  color:#482c20;
  background:#fffaf2f2;
  border:1px solid #d5baa5;
  border-radius:5px;
  font-size:clamp(8px,1.25vw,13px);
  font-weight:800;
  padding:2px 3px;
}
.pin .symbol{
  width:clamp(17px,2.8vw,29px);
  height:clamp(17px,2.8vw,29px);
}
.pin svg{width:100%;height:100%;display:block}
.pin .temp{
  background:#fff4e5f5;
  color:#4a291b;
  border:1px solid #d4b29a;
  border-radius:6px;
  padding:1px 4px;
  font-size:clamp(9px,1.45vw,15px);
  font-weight:800;
}
.pin.edge-right{transform:translate(-100%,-50%)}
.pin.edge-left{transform:translate(0,-50%)}

.status{
  position:absolute;
  left:28%;
  right:5%;
  bottom:11%;
  padding:5px;
  border-radius:5px;
  background:#fffaf3ee;
  color:#563428;
  font-size:11px;
  text-align:center;
}

@media(max-width:500px){
  .days button{font-size:7px;border-radius:4px}
  .pin .name{font-size:8px;padding:1px 2px}
  .pin .symbol{width:18px;height:18px}
  .pin .temp{font-size:9px;padding:1px 2px}
}
</style>
</head>
<body>

<main class="weather">
<img
  class="background"
  src="https://cacaoradio.github.io/cacao-radio/fond-meteo-cacao-radio.png"
  alt="Météo Cacao Radio"
  width="1312"
  height="1199"
>

<div class="overlay">
  <nav id="days" class="days" aria-label="Choisir le jour"></nav>
  <div id="pins"></div>
  <div id="status" class="status" role="status">Chargement de la météo…</div>
</div>
</main>

<script>
const cities=[
  {name:'Lille',lat:50.6292,lon:3.0573,x:63,y:46},
  {name:'Le Havre',lat:49.4944,lon:0.1079,x:51,y:52},
  {name:'Paris',lat:48.8566,lon:2.3522,x:66,y:57},
  {name:'Strasbourg',lat:48.5734,lon:7.7521,x:85,y:58},
  {name:'Brest',lat:48.3904,lon:-4.4861,x:31,y:59},
  {name:'Rennes',lat:48.1173,lon:-1.6778,x:47,y:62},
  {name:'Nantes',lat:47.2184,lon:-1.5536,x:48,y:68},
  {name:'Tours',lat:47.3941,lon:0.6848,x:60,y:67},
  {name:'Dijon',lat:47.322,lon:5.0415,x:76,y:68},
  {name:'Lyon',lat:45.764,lon:4.8357,x:76,y:77},
  {name:'Bordeaux',lat:44.8378,lon:-0.5792,x:53,y:78},
  {name:'Toulouse',lat:43.6047,lon:1.4442,x:65,y:85},
  {name:'Marseille',lat:43.2965,lon:5.3698,x:83,y:85},
  {name:'Ajaccio',lat:41.9192,lon:8.7386,x:92,y:90,edge:'edge-right'}
];

function icon(code){
  const sun='<circle cx="24" cy="24" r="9" fill="#ffca36" stroke="#e8a720" stroke-width="2"/><path d="M24 3v9M24 36v9M3 24h9M36 24h9M9 9l7 7M32 32l7 7M39 9l-7 7M16 32l-7 7" stroke="#e8a720" stroke-width="2.5" stroke-linecap="round"/>';
  const cloud='<path d="M12 36h27c6 0 10-5 10-10s-4-9-10-9h-3C34 10 28 7 22 9c-7 1-11 6-12 13-5 0-8 3-8 7 0 5 4 7 10 7z" fill="#f2f6fb" stroke="#92a4b5" stroke-width="2"/>';
  const rain='<path d="M14 39l-3 7M27 39l-3 7M40 39l-3 7" stroke="#309ad6" stroke-width="3" stroke-linecap="round"/>';
  const snow='<g fill="#75bce7"><circle cx="13" cy="44" r="3"/><circle cx="27" cy="45" r="3"/><circle cx="40" cy="44" r="3"/></g>';
  const thunder='<path d="M27 34l-8 12h8l-3 8 15-17h-9l3-6" fill="#ffc52f" stroke="#b78a1b"/>';
  const fog='<path d="M7 40h37M12 47h29" stroke="#9cabb6" stroke-width="3" stroke-linecap="round"/>';
  let parts;
  if(code===0)parts=sun;
  else if(code<=2)parts=sun+cloud;
  else if(code===3)parts=cloud;
  else if(code===45||code===48)parts=cloud+fog;
  else if(code>=51&&code<=67)parts=cloud+rain;
  else if(code>=71&&code<=77)parts=cloud+snow;
  else if(code>=80&&code<=82)parts=sun+cloud+rain;
  else if(code>=95)parts=cloud+thunder;
  else parts=sun+cloud;
  return '<svg viewBox="0 0 54 56" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'+parts+'</svg>';
}

let forecasts=[];
let chosen=0;
const days=document.getElementById('days');
const pins=document.getElementById('pins');
const status=document.getElementById('status');

function render(){
  const dates=forecasts[0].daily.time;

  days.innerHTML=dates.map((date,i)=>{
    let label;
    if(i===0)label="Aujourd'hui";
    else if(i===1)label='Demain';
    else label=new Intl.DateTimeFormat('fr-FR',{
      weekday:'short',
      day:'numeric'
    }).format(new Date(date+'T12:00:00'));
    return '<button type="button" data-day="'+i+'" aria-pressed="'+(i===chosen)+'">'+label+'</button>';
  }).join('');

  pins.innerHTML=cities.map((city,i)=>{
    const d=forecasts[i].daily;
    const temp=Math.round(d.temperature_2m_max[chosen]);
    const code=d.weather_code[chosen];
    return '<div class="pin '+(city.edge||'')+'" style="left:'+city.x+'%;top:'+city.y+'%">'+
      '<span class="name">'+city.name+'</span>'+
      '<span class="symbol">'+icon(code)+'</span>'+
      '<span class="temp">'+temp+'°</span>'+
      '</div>';
  }).join('');

  status.style.display='none';

  days.querySelectorAll('button').forEach(button=>{
    button.onclick=()=>{
      chosen=Number(button.dataset.day);
      render();
    };
  });
  reportHeight();
}

function reportHeight(){
  if(window.parent!==window){
    window.parent.postMessage({
      type:'cacao-meteo-height',
      height:Math.ceil(document.documentElement.scrollHeight)
    },'*');
  }
}

(async()=>{
  try{
    const params=new URLSearchParams({
      latitude:cities.map(c=>c.lat).join(','),
      longitude:cities.map(c=>c.lon).join(','),
      daily:'weather_code,temperature_2m_max',
      timezone:'Europe/Paris',
      forecast_days:'5'
    });
    const response=await fetch('https://api.open-meteo.com/v1/forecast?'+params);
    if(!response.ok)throw new Error('HTTP '+response.status);
    const data=await response.json();
    forecasts=Array.isArray(data)?data:[data];
    if(forecasts.length!==cities.length)throw new Error('Réponse incomplète');
    render();
  }catch(error){
    status.textContent='Prévisions momentanément indisponibles.';
    console.error(error);
  }
})();

window.addEventListener('load',reportHeight);
window.addEventListener('resize',reportHeight);
</script>
</body>
</html>
