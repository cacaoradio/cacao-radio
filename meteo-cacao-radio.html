
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Météo en France — Cacao Radio</title>

<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  padding:0;
  background:transparent;
  font-family:Arial,Helvetica,sans-serif;
}
.weather{
  position:relative;
  width:100%;
  max-width:940px;
  margin:0 auto;
  overflow:hidden;
}
.background{
  display:block;
  width:100%;
  height:auto;
}
.layer{
  position:absolute;
  inset:0;
  pointer-events:none;
}

/* Boutons interactifs */
.days{
  position:absolute;
  left:18.2%;
  top:28.7%;
  width:69.7%;
  height:4.3%;
  display:flex;
  gap:0.7%;
  pointer-events:auto;
}
.days button{
  flex:1 1 0;
  min-width:0;
  border:1px solid #c8a48d;
  border-radius:7px;
  background:#fffaf3;
  color:#563428;
  font-family:Arial,Helvetica,sans-serif;
  font-size:clamp(6px,1.15vw,12px);
  font-weight:700;
  white-space:nowrap;
  padding:0 1px;
  cursor:pointer;
}
.days button[aria-pressed="true"]{
  background:#563428;
  color:white;
}

/* Villes */
.pin{
  position:absolute;
  transform:translate(-50%,-50%);
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  white-space:nowrap;
  line-height:1.05;
  z-index:2;
}
.pin[data-side="left"]{
  transform:translate(0,-50%);
}
.pin[data-side="right"]{
  transform:translate(-100%,-50%);
}
.pin .name{
  background:#fffaf1ed;
  color:#44271b;
  border:1px solid #c8aa8e;
  border-radius:5px;
  padding:1px 3px;
  font-size:clamp(7px,1.2vw,13px);
  font-weight:800;
}
.pin .symbol{
  width:clamp(15px,2.7vw,29px);
  height:clamp(15px,2.7vw,29px);
  display:block;
  filter:drop-shadow(0 1px 2px #ffffff);
}
.pin .symbol svg{
  display:block;
  width:100%;
  height:100%;
}
.pin .temp{
  background:#fff0d9f2;
  color:#432316;
  border:1px solid #c9a184;
  border-radius:6px;
  padding:1px 3px;
  font-size:clamp(8px,1.4vw,15px);
  font-weight:800;
}
.message{
  position:absolute;
  left:26%;
  right:5%;
  bottom:12%;
  padding:5px;
  background:#fffaf1ee;
  color:#563428;
  border-radius:6px;
  text-align:center;
  font-size:12px;
}

@media(max-width:500px){
  .days button{
    font-size:6px;
    border-radius:3px;
  }
  .pin .name{
    font-size:7px;
    padding:1px 2px;
  }
  .pin .symbol{
    width:15px;
    height:15px;
  }
  .pin .temp{
    font-size:8px;
    padding:1px 2px;
  }
}
</style>
</head>

<body>
<main class="weather">

<img
  class="background"
  src="https://cacaoradio.github.io/cacao-radio/fond-meteo-cacao-radio.png"
  alt="Météo Cacao Radio, présentateur chocolat guimauve devant la carte de France"
  width="1312"
  height="1199"
>

<div class="layer">
  <nav class="days" id="days"
       aria-label="Choisir le jour"></nav>
  <div id="pins"></div>
  <div class="message" id="message"
       role="status">
    Chargement des prévisions…
  </div>
</div>

</main>

<script>
'use strict';

const cities=[
{name:'Lille',lat:50.6292,lon:3.0573,x:63,y:33},
{name:'Le Havre',lat:49.4944,lon:0.1079,x:51,y:41},
{name:'Paris',lat:48.8566,lon:2.3522,x:66,y:47},
{name:'Strasbourg',lat:48.5734,lon:7.7521,x:85,y:47},
{name:'Brest',lat:48.3904,lon:-4.4861,x:31,y:47},
{name:'Rennes',lat:48.1173,lon:-1.6778,x:47,y:51},
{name:'Nantes',lat:47.2184,lon:-1.5536,x:48,y:60},
{name:'Tours',lat:47.3941,lon:0.6848,x:60,y:57},
{name:'Dijon',lat:47.322,lon:5.0415,x:76,y:58},
{name:'Lyon',lat:45.764,lon:4.8357,x:76,y:70},
{name:'Bordeaux',lat:44.8378,lon:-0.5792,x:53,y:73},
{name:'Toulouse',lat:43.6047,lon:1.4442,x:65,y:82},
{name:'Marseille',lat:43.2965,lon:5.3698,x:83,y:82},
{name:'Ajaccio',lat:41.9192,lon:8.7386,x:92,y:88,side:'right'}
];

/* Pictogrammes météo SVG */
function weatherIcon(code){
  const sun=`
    <circle cx="24" cy="24" r="9"
      fill="#FFC83D" stroke="#E5A51E" stroke-width="2"/>
    <g stroke="#E5A51E" stroke-width="2.5"
       stroke-linecap="round">
      <path d="M24 4v7M24 37v7M4 24h7M37 24h7
               M10 10l5 5M33 33l5 5M38 10l-5 5M15 33l-5 5"/>
    </g>`;

  const cloud=`
    <path d="M13 35h24c6 0 9-4 9-9
             0-5-4-9-9-9-1 0-2 0-3 1
             -2-6-7-10-13-10-8 0-14 6-14 14
             -4 1-6 4-6 7 0 4 4 6 12 6z"
      fill="#F2F5FA"
      stroke="#8D9BAB"
      stroke-width="2"/>`;

  const rain=`
    <g stroke="#3E9ED7" stroke-width="3"
       stroke-linecap="round">
      <path d="M14 38l-3 6M26 38l-3 6M38 38l-3 6"/>
    </g>`;

  const snow=`
    <g fill="#6CB9E6">
      <circle cx="13" cy="41" r="3"/>
      <circle cx="25" cy="43" r="3"/>
      <circle cx="37" cy="41" r="3"/>
    </g>`;

  const thunder=`
    <path d="M26 35l-7 10h8l-3 9 14-16h-9l4-7"
      fill="#F5B72E" stroke="#B98516" stroke-width="1"/>`;

  const fog=`
    <g stroke="#91A3AD" stroke-width="3"
       stroke-linecap="round">
      <path d="M7 38h34M12 44h29"/>
    </g>`;

  let content='';

  if(code===0){
    content=sun;
  }else if(code<=2){
    content=sun+cloud;
  }else if(code===3){
    content=cloud;
  }else if(code===45||code===48){
    content=cloud+fog;
  }else if(code>=51&&code<=67){
    content=cloud+rain;
  }else if(code>=71&&code<=77){
    content=cloud+snow;
  }else if(code>=80&&code<=82){
    content=sun+cloud+rain;
  }else if(code>=95){
    content=cloud+thunder;
  }else{
    content=sun+cloud;
  }

  return `<svg viewBox="0 0 54 56"
    xmlns="http://www.w3.org/2000/svg"
    aria-hidden="true">${content}</svg>`;
}

function description(code){
  if(code===0)return 'Ensoleillé';
  if(code<=2)return 'Éclaircies';
  if(code===3)return 'Couvert';
  if(code===45||code===48)return 'Brouillard';
  if(code>=51&&code<=67)return 'Pluie';
  if(code>=71&&code<=77)return 'Neige';
  if(code>=80&&code<=82)return 'Averses';
  if(code>=95)return 'Orages';
  return 'Variable';
}

let forecasts=[];
let selected=0;

const days=document.getElementById('days');
const pins=document.getElementById('pins');
const message=document.getElementById('message');

function dateLabel(date,i){
  if(i===0)return "Aujourd'hui";
  if(i===1)return 'Demain';

  return new Intl.DateTimeFormat('fr-FR',{
    weekday:'short',
    day:'numeric',
    timeZone:'Europe/Paris'
  }).format(new Date(date+'T12:00:00'));
}

function render(){
  const dates=forecasts[0].daily.time;

  days.innerHTML=dates.map((date,i)=>`
    <button type="button"
      data-day="${i}"
      aria-pressed="${i===selected}">
      ${dateLabel(date,i)}
    </button>
  `).join('');

  pins.innerHTML=cities.map((city,i)=>{
    const data=forecasts[i].daily;
    const code=data.weather_code[selected];
    const temp=Math.round(
      data.temperature_2m_max[selected]
    );

    return `
      <div class="pin"
        data-side="${city.side||''}"
        style="left:${city.x}%;top:${city.y}%"
        title="${city.name} : ${description(code)}">
        <span class="name">${city.name}</span>
        <span class="symbol">${weatherIcon(code)}</span>
        <span class="temp">${temp}°</span>
      </div>`;
  }).join('');

  message.style.display='none';

  days.querySelectorAll('button').forEach(button=>{
    button.addEventListener('click',()=>{
      selected=Number(button.dataset.day);
      render();
    });
  });

  reportHeight();
}

function reportHeight(){
  const height=Math.ceil(
    document.documentElement.getBoundingClientRect().height
  );

  if(window.parent!==window){
    window.parent.postMessage({
      type:'cacao-meteo-height',
      height:height
    },'*');
  }
}

(async function(){
  try{
    const params=new URLSearchParams({
      latitude:cities.map(c=>c.lat).join(','),
      longitude:cities.map(c=>c.lon).join(','),
      daily:'weather_code,temperature_2m_max',
      timezone:'Europe/Paris',
      forecast_days:'5'
    });

    const response=await fetch(
      'https://api.open-meteo.com/v1/forecast?'+params
    );

    if(!response.ok){
      throw new Error('HTTP '+response.status);
    }

    const data=await response.json();
    forecasts=Array.isArray(data)?data:[data];

    if(forecasts.length!==cities.length){
      throw new Error('Réponse incomplète');
    }

    render();

  }catch(error){
    message.textContent=
      'Prévisions momentanément indisponibles.';
    console.error(error);
  }
})();

window.addEventListener('load',reportHeight);
window.addEventListener('resize',reportHeight);
</script>
</body>
</html>
