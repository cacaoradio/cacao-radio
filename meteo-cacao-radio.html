<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Météo France — Cacao Radio</title>
<style>
:root{--brown:#563428;--cream:#fffaf3;--muted:#80675b}*{box-sizing:border-box}body{margin:0;background:transparent;color:var(--brown);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}.widget{max-width:940px;margin:auto;background:linear-gradient(160deg,#fffdf9,#f7eadb);border:1px solid #e8d8c8;border-radius:18px;padding:18px;box-shadow:0 10px 32px #5634280d}.top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}h1{font-size:24px;margin:0;font-weight:750}.sub{color:var(--muted);font-size:12px}.days{display:flex;gap:7px;overflow-x:auto;padding:15px 0 8px}.days button{flex:1;min-width:94px;border:1px solid #d9c2b2;border-radius:11px;background:white;color:var(--brown);padding:10px 6px;cursor:pointer;font-weight:650}.days button[aria-pressed=true]{background:var(--brown);color:white}.body{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}.map{position:relative;max-width:660px;margin:auto;width:100%;aspect-ratio:500/510;background:radial-gradient(ellipse at 55% 40%,#edf5f4 0%,#e5f0ef 68%,#f7f3ec 100%);border-radius:16px;overflow:hidden}.map svg{width:100%;height:100%;display:block}.pin{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;flex-direction:column;line-height:1.05;white-space:nowrap;text-align:center;z-index:2;filter:drop-shadow(0 1px 2px #ffffffcc)}.pin .temp{background:#fffdfaeb;border:1px solid #ddc6b4;border-radius:8px;padding:2px 5px;box-shadow:0 1px 4px #56342818}.pin .weather{filter:drop-shadow(0 1px 1px #ffffff)}.pin .city{font-size:10px;font-weight:750;color:#50362b;background:#ffffffad;border-radius:4px;padding:1px 2px}.pin .weather{font-size:20px;line-height:1.15}.pin .temp{font-size:12px;font-weight:800}.details{display:none;padding:7px 0}.details h2{font-size:17px;margin:0 0 8px}.list{display:grid;grid-template-columns:1fr 1fr;gap:7px}.item{background:white;border:1px solid #e8d8c8;border-radius:10px;padding:8px;font-size:12px}.item strong{display:block;font-size:13px}.item span{font-size:17px}.status{font-size:12px;color:var(--muted);padding-top:10px}.credit{font-size:11px;color:var(--muted);margin-top:12px}.credit a{color:inherit}@media(max-width:650px){.widget{padding:12px;border-radius:12px}h1{font-size:21px}.body{grid-template-columns:1fr}.map{max-width:440px}.details{padding:0}.list{grid-template-columns:repeat(3,1fr)}.pin .city{font-size:8px}.pin .temp{font-size:9px;padding:1px 3px}.pin .weather{font-size:14px}.pin.mobile-hide{display:none}}@media(max-width:390px){.list{grid-template-columns:1fr 1fr}}
</style></head><body><main class="widget"><div class="top"><h1>☀️ La météo en France</h1><div class="sub">CACAO RADIO · Prévisions sur 5 jours · 25 villes</div></div><nav class="days" id="days" aria-label="Choisir le jour"></nav><div class="body"><section class="map" aria-label="Carte météo de France"><svg viewBox="0 0 500 510" role="img" aria-label="Contours géographiques de la France métropolitaine"><path d="M 418.5 109.3 L 435.1 123.4 L 485.9 133.3 L 468.1 170.0 L 463.6 208.3 L 454.0 217.4 L 437.9 212.5 L 439.0 226.1 L 413.3 256.3 L 412.8 280.6 L 429.6 272.2 L 441.7 295.7 L 440.2 310.9 L 450.6 331.1 L 438.4 347.4 L 447.4 389.0 L 466.5 395.8 L 462.5 419.1 L 430.6 449.4 L 361.2 434.9 L 309.9 452.3 L 305.8 484.6 L 265.0 491.6 L 225.4 467.3 L 212.6 478.9 L 147.8 454.5 L 133.8 433.6 L 152.0 401.4 L 158.7 294.5 L 122.3 238.1 L 96.4 211.0 L 42.6 190.3 L 39.0 151.2 L 84.7 139.5 L 143.8 153.3 L 132.6 92.5 L 165.9 115.6 L 247.8 73.7 L 258.4 29.7 L 289.2 18.9 L 294.3 37.7 L 310.7 38.6 L 327.0 60.2 L 351.6 85.5 L 369.7 81.3 L 400.5 105.8 L 408.4 110.4 L 418.5 109.3 Z" fill="#efe1ca" stroke="#9d7863" stroke-width="2.3" stroke-linejoin="round"/></svg><div id="pins"></div></section><div class="status" id="status" role="status">Chargement des prévisions…</div></div><div class="credit">Données météo : <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>. Carte géographique, températures maximales journalières. Prévisions indicatives.</div></main>
<script>
const cities=[
{name:'Lille',lat:50.6292,lon:3.0573,x:61.65,y:9.17,mobileHide:false},
{name:'Brest',lat:48.3904,lon:-4.4861,x:8.55,y:32.74,mobileHide:false},
{name:'Paris',lat:48.8566,lon:2.3522,x:56.69,y:27.84,mobileHide:false},
{name:'Strasbourg',lat:48.5734,lon:7.7521,x:94.70,y:30.82,mobileHide:false},
{name:'Rennes',lat:48.1173,lon:-1.6778,x:28.32,y:35.62,mobileHide:false},
{name:'Nantes',lat:47.2184,lon:-1.5536,x:29.19,y:45.09,mobileHide:false},
{name:'Lyon',lat:45.764,lon:4.8357,x:74.17,y:60.40,mobileHide:false},
{name:'Bordeaux',lat:44.8378,lon:-0.5792,x:36.05,y:70.15,mobileHide:false},
{name:'Toulouse',lat:43.6047,lon:1.4442,x:50.30,y:83.14,mobileHide:false},
{name:'Montpellier',lat:43.6108,lon:3.8767,x:67.42,y:83.07,mobileHide:false},
{name:'Marseille',lat:43.2965,lon:5.3698,x:77.93,y:86.38,mobileHide:false},
{name:'Nice',lat:43.7102,lon:7.262,x:91.25,y:82.03,mobileHide:false},
{name:'Orléans',lat:47.9029,lon:1.9093,x:53.57,y:37.88,mobileHide:false},
{name:'Tours',lat:47.3941,lon:0.6848,x:44.95,y:43.24,mobileHide:false},
{name:'Bourges',lat:47.081,lon:2.3988,x:57.02,y:46.53,mobileHide:false},
{name:'Châteauroux',lat:46.8114,lon:1.6868,x:52.00,y:49.37,mobileHide:true},
{name:'Blois',lat:47.5861,lon:1.3359,x:49.53,y:41.21,mobileHide:true},
{name:'Clermont-Ferrand',lat:45.7772,lon:3.087,x:61.86,y:60.26,mobileHide:false},
{name:'Limoges',lat:45.8336,lon:1.2611,x:49.01,y:59.67,mobileHide:false},
{name:'Nevers',lat:46.9896,lon:3.159,x:62.37,y:47.49,mobileHide:true},
{name:'Auxerre',lat:47.7982,lon:3.573,x:65.28,y:38.98,mobileHide:false},
{name:'Dijon',lat:47.322,lon:5.0415,x:75.62,y:43.99,mobileHide:false},
{name:'Poitiers',lat:46.5802,lon:0.3404,x:42.52,y:51.81,mobileHide:false},
{name:'Grenoble',lat:45.1885,lon:5.7245,x:80.43,y:66.46,mobileHide:true},
{name:'Reims',lat:49.2583,lon:4.0317,x:68.51,y:23.61,mobileHide:true}
];
const symbols=code=>code===0?'☀️':code<=2?'🌤️':code===3?'☁️':code===45||code===48?'🌫️':code>=51&&code<=67?'🌧️':code>=71&&code<=77?'🌨️':code>=80&&code<=82?'🌦️':code>=95?'⛈️':'🌤️';
const describe=code=>code===0?'Ensoleillé':code<=2?'Éclaircies':code===3?'Couvert':code===45||code===48?'Brouillard':code>=51&&code<=67?'Pluie':code>=71&&code<=77?'Neige':code>=80&&code<=82?'Averses':code>=95?'Orages':'Variable';
let forecasts=[],chosen=0;
function render(){const f=forecasts[0].daily, dates=f.time;document.getElementById('days').innerHTML=dates.map((d,i)=>`<button type="button" aria-pressed="${i===chosen}" data-day="${i}">${i===0?"Aujourd'hui":i===1?'Demain':new Intl.DateTimeFormat('fr-FR',{weekday:'short',day:'numeric'}).format(new Date(d+'T12:00:00'))}</button>`).join('');document.getElementById('pins').innerHTML=cities.map((c,i)=>{const d=forecasts[i].daily;return `<div class="pin ${c.mobileHide?'mobile-hide':''}" style="left:${c.x}%;top:${c.y}%" title="${c.name} : ${describe(d.weather_code[chosen])}"><span class="city">${c.name}</span><span class="weather">${symbols(d.weather_code[chosen])}</span><span class="temp">${Math.round(d.temperature_2m_max[chosen])}°</span></div>`}).join('');document.getElementById('status').textContent='Prévisions sur 5 jours · Mise à jour à chaque ouverture · Températures maximales';document.getElementById('days').querySelectorAll('button').forEach(b=>b.onclick=()=>{chosen=Number(b.dataset.day);render()})}
(async()=>{try{const url='https://api.open-meteo.com/v1/forecast?'+new URLSearchParams({latitude:cities.map(c=>c.lat).join(','),longitude:cities.map(c=>c.lon).join(','),daily:'weather_code,temperature_2m_max,temperature_2m_min',timezone:'Europe/Paris',forecast_days:'5'});const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();forecasts=Array.isArray(data)?data:[data];if(forecasts.length!==cities.length)throw new Error('Réponse incomplète');render()}catch(e){document.getElementById('status').textContent='Prévisions momentanément indisponibles. Réessayez dans quelques instants.';console.error(e)}})();
</script></body></html>
