
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Météo en France — Cacao Radio</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: transparent;
  font-family: Arial, Helvetica, sans-serif;
}

.weather {
  position: relative;
  width: 100%;
  max-width: 940px;
  margin: 0 auto;
  overflow: hidden;
  container-type: inline-size;
}

.background {
  display: block;
  width: 100%;
  height: auto;
}

.overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

/* Boutons des cinq jours */
.days {
  position: absolute;
  left: 14.8%;
  top: 18.9%;
  width: 75%;
  height: 5.1%;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 0.8%;
  pointer-events: auto;
}

.days button {
  min-width: 0;
  margin: 0;
  padding: 0 1px;
  border: 0;
  background: transparent;
  color: #563428;
  font-family: Arial, Helvetica, sans-serif;
  font-size: clamp(7px, 1.65cqw, 14px);
  font-weight: 800;
  white-space: nowrap;
  cursor: pointer;
}

.days button[aria-pressed="true"] {
  color: white;
}

.days button:focus-visible {
  outline: 2px solid #563428;
  outline-offset: -2px;
}

/* Villes et températures */
.pin {
  position: absolute;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  white-space: nowrap;
  line-height: 1.05;
  z-index: 2;
}

.pin .name {
  background: rgba(255,250,243,.96);
  color: #482b20;
  border-radius: 5px;
  padding: 2px 4px;
  font-size: clamp(8px, 1.8cqw, 15px);
  font-weight: 800;
  box-shadow: 0 1px 3px #0003;
}

.pin .symbol {
  display: block;
  width: clamp(16px, 3.1cqw, 29px);
  height: clamp(16px, 3.1cqw, 29px);
  margin: 1px 0;
}

.pin .symbol svg {
  display: block;
  width: 100%;
  height: 100%;
}

.pin .temp {
  background: rgba(255,250,243,.97);
  color: #482b20;
  border: 1px solid #d6bda8;
  border-radius: 7px;
  padding: 2px 5px;
  font-size: clamp(9px, 1.85cqw, 16px);
  font-weight: 800;
  box-shadow: 0 1px 3px #0003;
}

.status {
  position: absolute;
  top: 26%;
  left: 35%;
  right: 8%;
  background: #fffaf3f2;
  color: #563428;
  border-radius: 7px;
  padding: 8px;
  font-size: 12px;
  text-align: center;
}

@media (max-width: 500px) {
  .days button {
    font-size: clamp(7px, 2.1cqw, 10px);
  }

  .pin .name {
    font-size: clamp(8px, 2.1cqw, 11px);
    padding: 1px 3px;
  }

  .pin .symbol {
    width: clamp(17px, 4.4cqw, 21px);
    height: clamp(17px, 4.4cqw, 21px);
  }

  .pin .temp {
    font-size: clamp(9px, 2.35cqw, 12px);
    padding: 1px 3px;
  }
}
</style>
</head>

<body>

<main class="weather" id="weather">

<img
  class="background"
  id="weather-background"
  src="https://cacaoradio.github.io/cacao-radio/fond-meteo-cacao-radio.png?v=20261023-3"
  alt="Cacao Radio : présentateur météo chocolat guimauve devant une carte de France"
  width="1279"
  height="1169"
>

<div class="overlay">
  <nav class="days" id="days" aria-label="Choisir le jour"></nav>
  <div id="pins"></div>
  <div class="status" id="status" role="status">
    Chargement des prévisions…
  </div>
</div>

</main>

<script>
'use strict';

const cities = [
  {name:'Lille',lat:50.6292,lon:3.0573,x:63,y:34},
  {name:'Le Havre',lat:49.4944,lon:0.1079,x:48,y:41},
  {name:'Paris',lat:48.8566,lon:2.3522,x:61,y:45},
  {name:'Strasbourg',lat:48.5734,lon:7.7521,x:82,y:47},
  {name:'Brest',lat:48.3904,lon:-4.4861,x:34,y:49},
  {name:'Rennes',lat:48.1173,lon:-1.6778,x:45,y:53},
  {name:'Nantes',lat:47.2184,lon:-1.5536,x:45,y:61},
  {name:'Tours',lat:47.3941,lon:0.6848,x:56,y:55},
  {name:'Dijon',lat:47.322,lon:5.0415,x:72,y:56},
  {name:'Lyon',lat:45.764,lon:4.8357,x:73,y:65},
  {name:'Bordeaux',lat:44.8378,lon:-0.5792,x:49,y:69},
  {name:'Toulouse',lat:43.6047,lon:1.4442,x:59,y:77},
  {name:'Marseille',lat:43.2965,lon:5.3698,x:76,y:76},
  {name:'Ajaccio',lat:41.9192,lon:8.7386,x:88,y:83}
];

function weatherIcon(code) {
  const sun = `
    <circle cx="25" cy="25" r="9"
      fill="#ffcb38" stroke="#e9a51c" stroke-width="2"/>
    <path d="M25 3v9M25 38v9M3 25h9M38 25h9
      M9 9l7 7M34 34l7 7M41 9l-7 7M16 34l-7 7"
      stroke="#efb02a" stroke-width="3"
      stroke-linecap="round"/>
  `;

  const cloud = `
    <path d="M12 37h27c6 0 10-5 10-10
      0-6-4-9-10-9h-3
      C34 11 28 8 22 10
      15 11 11 16 10 23
      5 23 2 27 2 30
      2 35 6 37 12 37Z"
      fill="#f1f5fb"
      stroke="#8299ad"
      stroke-width="2"/>
  `;

  const rain = `
    <path d="M13 40l-3 8M27 40l-3 8M41 40l-3 8"
      stroke="#258fd4" stroke-width="3"
      stroke-linecap="round"/>
  `;

  const snow = `
    <g fill="#76bfe8">
      <circle cx="13" cy="45" r="3"/>
      <circle cx="27" cy="46" r="3"/>
      <circle cx="41" cy="45" r="3"/>
    </g>
  `;

  const fog = `
    <path d="M6 42h39M12 49h28"
      stroke="#98a7b5" stroke-width="3"
      stroke-linecap="round"/>
  `;

  const thunder = `
    <path d="M28 34L19 47h9l-4 8 17-19H31l3-6Z"
      fill="#ffc32d" stroke="#b88b17"/>
  `;

  let content;

  if (code === 0) content = sun;
  else if (code <= 2) content = sun + cloud;
  else if (code === 3) content = cloud;
  else if (code === 45 || code === 48) content = cloud + fog;
  else if (code >= 51 && code <= 67) content = cloud + rain;
  else if (code >= 71 && code <= 77) content = cloud + snow;
  else if (code >= 80 && code <= 82) content = sun + cloud + rain;
  else if (code >= 95) content = cloud + thunder;
  else content = sun + cloud;

  return `<svg viewBox="0 0 54 56"
    xmlns="http://www.w3.org/2000/svg"
    aria-hidden="true">${content}</svg>`;
}

function weatherDescription(code) {
  if (code === 0) return 'Ensoleillé';
  if (code <= 2) return 'Éclaircies';
  if (code === 3) return 'Couvert';
  if (code === 45 || code === 48) return 'Brouillard';
  if (code >= 51 && code <= 67) return 'Pluie';
  if (code >= 71 && code <= 77) return 'Neige';
  if (code >= 80 && code <= 82) return 'Averses';
  if (code >= 95) return 'Orages';
  return 'Variable';
}

let forecasts = [];
let selectedDay = 0;

const days = document.getElementById('days');
const pins = document.getElementById('pins');
const status = document.getElementById('status');

function dateLabel(date, index) {
  if (index === 0) return "Aujourd'hui";
  if (index === 1) return 'Demain';

  return new Intl.DateTimeFormat('fr-FR', {
    weekday: 'short',
    day: 'numeric',
    timeZone: 'Europe/Paris'
  }).format(new Date(date + 'T12:00:00'));
}

function render() {
  const dates = forecasts[0].daily.time;

  days.innerHTML = dates.map((date, index) => `
    <button
      type="button"
      data-day="${index}"
      aria-pressed="${index === selectedDay}">
      ${dateLabel(date, index)}
    </button>
  `).join('');

  pins.innerHTML = cities.map((city, index) => {
    const daily = forecasts[index].daily;
    const code = daily.weather_code[selectedDay];
    const temperature = Math.round(
      daily.temperature_2m_max[selectedDay]
    );

    return `
      <div class="pin"
        style="left:${city.x}%;top:${city.y}%"
        title="${city.name} : ${weatherDescription(code)}">
        <span class="name">${city.name}</span>
        <span class="symbol">${weatherIcon(code)}</span>
        <span class="temp">${temperature}°</span>
      </div>
    `;
  }).join('');

  status.style.display = 'none';

  days.querySelectorAll('button').forEach(button => {
    button.addEventListener('click', () => {
      selectedDay = Number(button.dataset.day);
      render();
    });
  });

  reportHeight();
}

function reportHeight() {
  if (window.parent === window) return;

  const height = Math.ceil(
    document.getElementById('weather')
      .getBoundingClientRect().height
  );

  window.parent.postMessage({
    type: 'cacao-meteo-height',
    height: height
  }, '*');
}

async function loadWeather() {
  try {
    const params = new URLSearchParams({
      latitude: cities.map(c => c.lat).join(','),
      longitude: cities.map(c => c.lon).join(','),
      daily: 'weather_code,temperature_2m_max',
      timezone: 'Europe/Paris',
      forecast_days: '5'
    });

    const response = await fetch(
      'https://api.open-meteo.com/v1/forecast?' + params
    );

    if (!response.ok) {
      throw new Error('HTTP ' + response.status);
    }

    const data = await response.json();
    forecasts = Array.isArray(data) ? data : [data];

    if (forecasts.length !== cities.length) {
      throw new Error('Réponse météo incomplète');
    }

    render();

  } catch (error) {
    status.textContent =
      'Prévisions momentanément indisponibles.';
    console.error(error);
  }
}

const background = document.getElementById('weather-background');

background.addEventListener('load', reportHeight);
window.addEventListener('load', reportHeight);
window.addEventListener('resize', reportHeight);

loadWeather();
</script>

</body>
</html>
