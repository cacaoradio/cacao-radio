<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Météo France — Cacao Radio</title>
<style>
:root{--brown:#563428;--cream:#fffaf3;--muted:#80675b}*{box-sizing:border-box}body{margin:0;background:transparent;color:var(--brown);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}.widget{max-width:940px;margin:auto;background:var(--cream);border:1px solid #e8d8c8;border-radius:18px;padding:18px}.top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}h1{font-size:24px;margin:0;font-weight:750}.sub{color:var(--muted);font-size:12px}.days{display:flex;gap:7px;overflow-x:auto;padding:15px 0 8px}.days button{flex:1;min-width:94px;border:1px solid #d9c2b2;border-radius:11px;background:white;color:var(--brown);padding:10px 6px;cursor:pointer;font-weight:650}.days button[aria-pressed=true]{background:var(--brown);color:white}.body{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}.map{position:relative;max-width:600px;margin:auto;width:100%;aspect-ratio:500/510}.map svg{width:100%;height:100%;display:block}.pin{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;flex-direction:column;line-height:1.1;white-space:nowrap;text-align:center;text-shadow:0 1px 2px white,1px 0 2px white,-1px 0 2px white}.pin .city{font-size:11px;font-weight:750}.pin .weather{font-size:19px;line-height:1.15}.pin .temp{font-size:11px;font-weight:750}.details{display:none;padding:7px 0}.details h2{font-size:17px;margin:0 0 8px}.list{display:grid;grid-template-columns:1fr 1fr;gap:7px}.item{background:white;border:1px solid #e8d8c8;border-radius:10px;padding:8px;font-size:12px}.item strong{display:block;font-size:13px}.item span{font-size:17px}.status{font-size:12px;color:var(--muted);padding-top:10px}.credit{font-size:11px;color:var(--muted);margin-top:12px}.credit a{color:inherit}@media(max-width:650px){.widget{padding:12px;border-radius:12px}h1{font-size:21px}.body{grid-template-columns:1fr}.map{max-width:440px}.details{padding:0}.list{grid-template-columns:repeat(3,1fr)}.pin .city,.pin .temp{font-size:10px}.pin .weather{font-size:17px}}@media(max-width:390px){.list{grid-template-columns:1fr 1fr}}
</style></head><body><main class="widget"><div class="top"><h1>☀️ La météo en France</h1><div class="sub">CACAO RADIO · Prévisions sur 5 jours</div></div><nav class="days" id="days" aria-label="Choisir le jour"></nav><div class="body"><section class="map" aria-label="Carte météo de France"><svg viewBox="0 0 500 510" role="img" aria-label="Carte schématique de la France métropolitaine"><path d="M190 45 L244 70 L298 67 L338 101 L391 108 L429 163 L416 216 L452 268 L415 312 L401 378 L350 417 L303 463 L251 454 L214 417 L151 419 L107 380 L78 321 L42 287 L64 244 L41 190 L91 145 L123 89 Z" fill="#f0e2d2" stroke="#9d7863" stroke-width="3" stroke-linejoin="round"/><path d="M190 45 L244 70 L298 67 L338 101 L391 108 L429 163 L416 216 L452 268 L415 312 L401 378 L350 417 L303 463 L251 454 L214 417 L151 419 L107 380 L78 321 L42 287 L64 244 L41 190 L91 145 L123 89 Z" fill="none" stroke="white" stroke-width="8" opacity=".25"/></svg><div id="pins"></div></section><div class="status" id="status" role="status">Chargement des prévisions…</div></div><div class="credit">Données météo : <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>. Carte schématique, températures maximales journalières. Prévisions indicatives.</div></main>
<script>
const cities=[
{name:'Lille',lat:50.6292,lon:3.0573,x:54,y:20},
{name:'Brest',lat:48.3904,lon:-4.4861,x:16,y:40},
{name:'Paris',lat:48.8566,lon:2.3522,x:50,y:34},
{name:'Strasbourg',lat:48.5734,lon:7.7521,x:80,y:35},
{name:'Rennes',lat:48.1173,lon:-1.6778,x:29,y:44},
{name:'Nantes',lat:47.2184,lon:-1.5536,x:29,y:54},
{name:'Lyon',lat:45.764,lon:4.8357,x:65,y:65},
{name:'Bordeaux',lat:44.8378,lon:-0.5792,x:35,y:74},
{name:'Toulouse',lat:43.6047,lon:1.4442,x:47,y:85},
{name:'Montpellier',lat:43.6108,lon:3.8767,x:59,y:87},
{name:'Marseille',lat:43.2965,lon:5.3698,x:68,y:90},
{name:'Nice',lat:43.7102,lon:7.262,x:81,y:84}
];
const symbols=code=>code===0?'☀️':code<=2?'🌤️':code===3?'☁️':code===45||code===48?'🌫️':code>=51&&code<=67?'🌧️':code>=71&&code<=77?'🌨️':code>=80&&code<=82?'🌦️':code>=95?'⛈️':'🌤️';
const describe=code=>code===0?'Ensoleillé':code<=2?'Éclaircies':code===3?'Couvert':code===45||code===48?'Brouillard':code>=51&&code<=67?'Pluie':code>=71&&code<=77?'Neige':code>=80&&code<=82?'Averses':code>=95?'Orages':'Variable';
let forecasts=[],chosen=0;
function render(){const f=forecasts[0].daily, dates=f.time;document.getElementById('days').innerHTML=dates.map((d,i)=>`<button type="button" aria-pressed="${i===chosen}" data-day="${i}">${i===0?"Aujourd'hui":i===1?'Demain':new Intl.DateTimeFormat('fr-FR',{weekday:'short',day:'numeric'}).format(new Date(d+'T12:00:00'))}</button>`).join('');document.getElementById('pins').innerHTML=cities.map((c,i)=>{const d=forecasts[i].daily;return `<div class="pin" style="left:${c.x}%;top:${c.y}%" title="${c.name} : ${describe(d.weather_code[chosen])}"><span class="city">${c.name}</span><span class="weather">${symbols(d.weather_code[chosen])}</span><span class="temp">${Math.round(d.temperature_2m_max[chosen])}°</span></div>`}).join('');document.getElementById('status').textContent='Prévisions actualisées automatiquement à chaque ouverture.';document.getElementById('days').querySelectorAll('button').forEach(b=>b.onclick=()=>{chosen=Number(b.dataset.day);render()})}
(async()=>{try{const url='https://api.open-meteo.com/v1/forecast?'+new URLSearchParams({latitude:cities.map(c=>c.lat).join(','),longitude:cities.map(c=>c.lon).join(','),daily:'weather_code,temperature_2m_max,temperature_2m_min',timezone:'Europe/Paris',forecast_days:'5'});const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();forecasts=Array.isArray(data)?data:[data];if(forecasts.length!==cities.length)throw new Error('Réponse incomplète');render()}catch(e){document.getElementById('status').textContent='Prévisions momentanément indisponibles. Réessayez dans quelques instants.';console.error(e)}})();
</script></body></html>
