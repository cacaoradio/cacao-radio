<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#371506">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Cacao Radio</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#32150b;font-family:Arial,sans-serif;text-align:center}
main{max-width:520px;margin:auto;padding:28px 18px 40px}
.logo{width:min(260px,72vw);height:auto;border-radius:50%}
h1{margin:18px 0 4px;font-size:30px}
.tag{margin:0 0 22px;color:#6b3a29;font-size:17px}
.radio{background:#371506;color:white;border-radius:18px;padding:24px 18px;margin-bottom:24px}
.status{font-size:14px;margin:8px 0 18px}
.play{width:78px;height:78px;border:0;border-radius:50%;background:white;color:#371506;font-size:34px}
.volume{margin-top:18px}
.volume input{width:65%;accent-color:white}
.links{display:grid;gap:10px}
.btn{padding:14px;border-radius:10px;background:#371506;color:white;text-decoration:none;font-weight:bold}
</style>
</head>

<body>
<main>

<img class="logo" src="icon-512.png" alt="Cacao Radio">

<h1>Cacao Radio</h1>
<p class="tag">Easy Listening Radio</p>

<section class="radio">
<strong>Écoutez Cacao Radio</strong>
<div class="status" id="status">Prêt à écouter</div>

<button class="play" id="play">▶</button>

<div class="volume">
🔈
<input id="volume" type="range" min="0" max="1" step="0.05" value="1">
🔊
</div>

<audio id="audio" preload="none" playsinline>
<source src="https://stream10.vestaradio.com/Cacao-Radio">
</audio>
</section>

<div class="links">
<a class="btn" href="https://cacaoradio.com">cacaoradio.com</a>
<a class="btn" href="https://www.instagram.com/cacao_radio">Instagram</a>
<a class="btn" href="https://www.facebook.com/share/1RcFB1YhKJ/">Facebook</a>
</div>

</main>

<script>
const audio=document.getElementById("audio");
const play=document.getElementById("play");
const status=document.getElementById("status");
const volume=document.getElementById("volume");

play.onclick=async()=>{
 if(audio.paused){
   status.textContent="Connexion…";
   try{await audio.play();}
   catch(e){status.textContent="Impossible de lancer le direct";}
 }else{
   audio.pause();
 }
};

audio.onplaying=()=>{
 play.textContent="❚❚";
 status.textContent="En direct";
};

audio.onpause=()=>{
 play.textContent="▶";
 status.textContent="Prêt à écouter";
};

volume.oninput=()=>audio.volume=volume.value;

if("mediaSession" in navigator){

 navigator.mediaSession.metadata=new MediaMetadata({
   title:"Cacao Radio",
   artist:"Easy Listening Radio",
   album:"En direct",
   artwork:[
     {src:"icon-192.png",sizes:"192x192",type:"image/png"},
     {src:"icon-512.png",sizes:"512x512",type:"image/png"}
   ]
 });

 navigator.mediaSession.setActionHandler("play",()=>audio.play());
 navigator.mediaSession.setActionHandler("pause",()=>audio.pause());
}

if("serviceWorker" in navigator){
 navigator.serviceWorker.register("./sw.js");
}
</script>

</body>
</html>
