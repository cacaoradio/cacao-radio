<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#371506">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Cacao Radio</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#fff;
 color:#32150b;
 font-family:Arial,sans-serif;
 text-align:center;
}

main{
 max-width:520px;
 margin:auto;
 padding:28px 18px 40px;
}

.logo{
 width:min(260px,72vw);
 height:auto;
 border-radius:50%;
}

h1{
 margin:18px 0 4px;
 font-size:30px;
}

.tag{
 margin:0 0 22px;
 color:#6b3a29;
 font-size:17px;
}

.radio{
 background:#371506;
 color:#fff;
 border-radius:18px;
 padding:24px 18px;
 margin-bottom:18px;
}

.status{
 font-size:14px;
 margin:8px 0 18px;
}

.play{
 width:78px;
 height:78px;
 border:0;
 border-radius:50%;
 background:#fff;
 color:#371506;
 font-size:34px;
}

.volume{
 margin-top:18px;
}

.volume input{
 width:65%;
 accent-color:#fff;
}

.tools{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:8px;
 margin-bottom:18px;
}

.tool{
 border:2px solid #371506;
 background:#fff;
 color:#371506;
 border-radius:12px;
 padding:13px 5px;
 font-weight:bold;
 font-size:14px;
}

.panel{
 display:none;
 border:1px solid #ddd;
 border-radius:12px;
 padding:16px;
 margin:-8px 0 20px;
 background:#faf7f5;
}

.panel select,
.panel input{
 padding:10px;
 border-radius:8px;
 border:1px solid #aaa;
 font-size:16px;
 margin:5px;
 max-width:90%;
}

.action{
 background:#371506;
 color:#fff;
 border:0;
 border-radius:8px;
 padding:11px 15px;
 font-weight:bold;
}

.cancel{
 background:#eee;
 color:#371506;
 border:0;
 border-radius:8px;
 padding:11px 15px;
 font-weight:bold;
}

.info{
 font-size:13px;
 color:#6b3a29;
 margin-top:10px;
}

.weatherNow{
 font-size:22px;
 font-weight:bold;
 margin:12px 0 4px;
}

.links{
 display:grid;
 gap:10px;
}

.btn{
 padding:14px;
 border-radius:10px;
 background:#371506;
 color:#fff;
 text-decoration:none;
 font-weight:bold;
}

.install{
 margin-top:25px;
 padding:16px;
 background:#faf7f5;
 border:1px solid #e2d5cf;
 border-radius:12px;
 color:#5a3022;
 font-size:13px;
 line-height:1.5;
 text-align:left;
}

.install-title{
 text-align:center;
 font-weight:bold;
 font-size:15px;
 margin-bottom:12px;
}

.install hr{
 border:0;
 border-top:1px solid #e2d5cf;
 margin:15px 0;
}
</style>
</head>

<body>

<main>

<img class="logo" src="icon-512.png" alt="Cacao Radio">

<h1>Cacao Radio</h1>
<p class="tag">Easy Listening Radio</p>


<section class="radio">

<strong>Écoutez Cacao Radio</strong>

<div class="status" id="status">
Prêt à écouter
</div>

<button class="play" id
